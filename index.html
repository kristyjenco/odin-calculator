<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #D5FFFF;
            }
            #main {
                border: 1px solid black;
                background-color: #DCDCDC;
                width: 300px;
                height: 350px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 8px;
                border-radius: 20px;
                box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.5);
            }
             #text {
                border: 1px solid black;
                width: 100%;
                font-size: 32px;
                color: white;
                background-color: black;
                text-align: right;
                box-sizing: border-box;
                padding-right: 5px;
                margin-bottom: 10px;
             }
             .button-row {
                display: flex;
                width: 100%;
                gap: 8px;
             }
            .button {
                font-size: 32px;
                color: white;
                background-color: gray;
                border: 1px solid black;
                border-radius: 8px;
                flex: 1;
            }
            .button:hover {
                background-color: #3b3b3b;
            }
            #divide, #multiply, #subtract, #add {
                background-color: #0F52BA;
            }
            #divide:hover, #multiply:hover, #subtract:hover, #add:hover {
                background-color: #083B89;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div id="text">0</div>
            <div class="button-row">
            <button type="button" class="button" value="7">7</button>
            <button type="button" class="button" value="8">8</button>
            <button type="button" class="button" value="9">9</button>
            <button type="button" class="button" id="divide" value="/">/</button>
            </div>
            <div class="button-row">
            <button type="button" class="button" value="4">4</button>
            <button type="button" class="button" value="5">5</button>
            <button type="button" class="button" value="6">6</button>
            <button type="button" class="button" id="multiply" value="*">*</button>
            </div>
            <div class="button-row">
            <button type="button" class="button" value="1">1</button>
            <button type="button" class="button" value="2">2</button>
            <button type="button" class="button" value="3">3</button>
            <button type="button" class="button" id="subtract" value="-">-</button>
            </div>
            <div class="button-row">
            <button type="button" class="button" value="0">0</button>
            <button type="button" class="button" value="clear">AC</button>
            <button type="button" class="button" id="equals" value="=">=</button>
            <button type="button" class="button" id="add" value="+">+</button>
            </div>
       </div>
        <script src="script.js"></script>
    </body>
  
</html>
